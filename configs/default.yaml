# Kairos default configuration.
# Every value here is configurable. Tune only on benchmark/datasets/train; use dev and official labels for evaluation.

corpus:
  profile: sample
  path: corpus/sample
  profiles:
    sample: [corpus/sample]
    science: [corpus/imported/scifact]
    general: [corpus/imported/squad]
    general_expanded: [corpus/imported/squad_v2_1]
    multi_domain_demo: [corpus/sample, corpus/imported/scifact, corpus/imported/squad]
    multi_domain_v2_1: [corpus/sample, corpus/imported/scifact, corpus/imported/squad_v2_1]
  places: [Pune, Mumbai, Delhi, New Delhi, Goa, Bengaluru, Bangalore, Chennai, Hyderabad, Kolkata, Jaipur, Ahmedabad, Gurugram, Noida]

retrieval:
  mode: hybrid                 # hybrid | dense | sparse            (ablation B)
  dense_backend: lsa           # lsa (no download, deterministic) | sentence-transformers
  dense_model: BAAI/bge-small-en-v1.5
  lsa_dims: 128
  bm25_k1: 1.5
  bm25_b: 0.75
  heading_boost: 2             # heading path tokens are repeated this many times in the BM25 doc
  rrf_k: 60
  candidates: 10               # per-retriever candidate depth before fusion (scale with corpus size)
  top_k: 5                     # evidence chunks kept per sub-query after rerank + dedup
  probe_k: 10                  # probe depth (BM25 only, section level)
  reranker: hybrid-linear      # hybrid-linear | cross-encoder | none
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  dedup_threshold: 0.92
  facet_bonus: 0.10
  heading_focus_bonus: 0.12
  place_mismatch_penalty: 0.5  # gazetteer consistency: chunk names only a different place than the query
  relevance_gate: true
  domain_routing: true
  relevance_min_coverage: 0.16
  relevance_min_rerank: 0.28
  relevance_min_dense: 0.08
  relevance_min_focus_terms: 1
  relevance_min_objective_coverage: 0.30
  domain_routing_min_confidence: 0.25
  probe_cache_size: 4096
  probe_cache_enabled: true

controller:
  mode: psrc                   # psrc | fixed_tokens | eou          (ablation A)
  policy_variant: baseline     # baseline | selected_v3 | named experiment arm
  fixed_tokens_n: 6
  stability_model: models/stability.json   # trained by `python -m kairos train-stability`; falls back to default_weights
  default_weights: {rho: 2.2, chi: 2.0, kappa: 2.4, sigma: 0.8, cont: 1.2, bias: -4.2}
  # lambda_latency, theta_min, rho_min, kappa_min: tuned label-free on the TRAINING streams by
  # `python -m kairos tune-controller` (max early rate s.t. premature ≤ 20%); dev is held out.
  lambda_latency: 0.5          # value of one second of hidden latency
  cost_retrieval: 0.4          # λ_C · C_r
  cost_noise: 0.6              # λ_N · N
  pipeline_latency_prior_s: 1.2  # downstream latency early retrieval can hide (generative deployment)
  adapt_latency: false          # true: learn it from measured latency (EMA)
  remaining_prior_s: 1.5
  theta_min: 0.30
  theta_max: 0.90
  rho_min: 0.3
  kappa_min: 0.45
  nu_min: 0.08
  hysteresis: 0.05
  tau_refine: 0.6
  budget_per_utterance: 6
  cold_start:
    enabled: false
    variant: CS0_original_heuristic
    threshold: 0.68
    min_relevance: 0.45
    min_constraint_readiness: 0.75
    max_constraint_risk: 0.45
    kappa_min: 0.30
    calibration:
      enabled: false
      method: platt
      slope: 1.0
      intercept: 0.0
  intent_completion:
    enabled: false
    threshold: 0.76
    guarded_first_observation_bypass: false
    min_evidence_relevance: 0.45
    max_constraint_risk: 0.35
  calibration:
    enabled: false
    method: identity
    slope: 1.0
    intercept: 0.0
  speculative:
    enabled: false
    min_term_jaccard: 0.75
  evidence_reuse:
    enabled: false
    max_entries: 64
    ttl_s: 300.0
  utility:
    enabled: false
    latency_scale_s: 1.2
    refinement_cost: 0.45
    extra_retrieval_cost: 0.12
    wait_utility: 0.0
    max_predicted_risk: 0.35
  iccos:
    enabled: false             # V2.3 remains behind a flag unless frozen promotion gates pass
    model_path: models/controller_v2_3/iccos_v1.json
    min_evidence_relevance: 0.16
    min_constraint_readiness: 0.75
    max_constraint_revision_risk: 0.70
    max_uncertainty: 0.70
    minimum_delta_q: 0.0
  caper:
    enabled: false             # experimental until the frozen V2.4 release gates pass
    policy: deterministic      # deterministic | eager (benchmark comparator only)
    deterministic_prefetch: true
    learned_prefetch:
      enabled: false
      model_path: models/controller_v2_4/caper.json
    min_content_terms: 2
    min_probe_relevance: 0.10
    min_revision_term_overlap: 0.45
    debounce_ms: 80
    provisional_ttl_s: 30.0
    finalization_wait_ms: 250
    max_active_prefetches_per_session: 2
    max_active_prefetches_per_intent: 1
    max_queued_prefetches_per_session: 4
    provisional_cache_enabled: true
    validated_reuse_enabled: true
    strict_commit_validation: true
  intent_scheduling:
    enabled: false

decomposer:
  mode: efis                   # efis | single                     (ablation E)
  theta_merge: 0.4             # parent-section footprint RBO(p=0.8) at/above which two needs are one intent
  theta_sem: 0.9               # dense cosine at/above which two needs are the same intent
  chi_min: 0.12                # clarity floor for a standalone intent
  anchor_weight: 0.4           # query weight of propagated anchor context
  footprint_validity_gate: true
  footprint_min_relevance: 0.35
  lexical_merge_min: 0.28
  semantic_subject_min: 0.50
  objective_compatibility_min: 0.75
  semantic_objective_merge: true
  topic_shift_guard: true

synthesis:
  backend: extractive          # extractive | gemini | ollama   (configs/gemini.yaml switches to Gemini)
  gemini_model: gemini-flash-latest   # free-tier alias; resolved model is recorded in telemetry
  gemini_thinking_level: low   # latency-sensitive route
  gemini_timeout_s: 30
  ollama_model: qwen2.5:7b-instruct
  llm_cache_dir: runs/llm_cache
  llm_mode: record             # record (call + cache) | replay (cache only)
  sentences_per_subquery: 2
  tau_sufficiency: 0.30        # min rerank relevance of the best chunk for a sub-query to be answerable
  tau_sentence: 0.34           # min sentence relevance for extraction
  require_sentence_focus: true

grounding:
  nli: lexical                 # lexical | cross-encoder
  nli_model: cross-encoder/nli-deberta-v3-small
  tau_support: 0.80
  tau_partial: 0.50
  conflict_overlap: 0.35
  require_quote: true
  verify_checksums: true

delta:
  refinement: delta            # delta | full_restart                (ablation C)
  max_added_per_subquery: 1
  scope_guard: true

session:
  ttl_s: 1800
  max_sessions: 64

live:
  mutable_tail_tokens: 2       # keep this many agreeing ASR tokens provisional before incremental commit
  max_utterance_chars: 4000    # hard limit for one cumulative microphone transcript
  max_message_bytes: 16384     # WebSocket inbound payload limit
  outbound_queue_size: 256     # bounded per-client engine-event queue
  resume_auth_timeout_s: 5.0   # resume capability must arrive in the first WebSocket message

telemetry:
  trace_dir: runs/traces
  sqlite_path: runs/telemetry.sqlite
  # Privacy-conscious default: persisted JSONL/SQLite telemetry excludes transcript and arbitrary strings.
  # Synthetic benchmark commands explicitly opt in when full content is required.
  trace_content: false

bench:
  results_dir: runs/bench
  targets:
    early_retrieval_rate: {op: ">=", value: 0.80, gate: G2}
    intent_recall: {op: ">=", value: 0.70, gate: G3}
    grounded_claim_rate: {op: ">=", value: 0.85, gate: G4}
    fabricated_doc_ids: {op: "==", value: 0, gate: G4}
    delta_retrieval_ratio: {op: "<", value: 1.0, gate: G5}
    false_retrieval_rate: {op: "==", value: 0.0, gate: G5}
    telemetry_coverage: {op: "==", value: 1.0, gate: G6}
    reproducibility_delta: {op: "==", value: 0.0, gate: G1}
